name: MERSIN LAB - Bagimsiz Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matematik-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: MERSIN matematik testleri
        run: python -m unittest -v test_lab

      - name: MERSIN ham veri kontrolu
        run: python veri_baglantisi.py

      - name: MERSIN V04 istatistik kontrolu
        run: python lab_v04.py

      - name: MERSIN gecmis veri toplama
        run: python gecmis_veri.py

      - name: MERSIN veri arsivini sakla
        uses: actions/upload-artifact@v6
        with:
          name: mersin-gecmis-verileri
          path: mersin_gecmis.json
          retention-days: 30
          if-no-files-found: error
